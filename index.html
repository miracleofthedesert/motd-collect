<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miracle of the Desert</title>
  <meta name="description" content="Continue to Miracle of the Desert." />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --button: #111111;
      --button-text: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    #loadingScreen {
      text-align: center;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 18px;
      border: 4px solid #e6e6e6;
      border-top: 4px solid #333333;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
      color: #555555;
    }

    #landingPage {
      display: none;
      opacity: 0;
      transition: opacity .18s ease;
    }

    #landingPage.visible {
      display: grid;
      opacity: 1;
    }

    .card {
      width: min(760px, 100%);
      text-align: center;
    }

    .brand {
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 700;
      letter-spacing: -0.035em;
      margin-bottom: 22px;
    }

    .copy {
      font-size: clamp(18px, 2.4vw, 28px);
      line-height: 1.35;
      color: var(--muted);
      margin: 0 auto 34px;
      max-width: 700px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 0 44px;
      border-radius: 14px;
      background: var(--button);
      color: var(--button-text);
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(18px, 2.2vw, 25px);
      transition: transform .15s ease, opacity .15s ease;
    }

    .button:hover { opacity: .9; }
    .button:active { transform: translateY(1px); }

    .note {
      margin-top: 22px;
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.45;
      color: #8a8a8a;
    }
  </style>
</head>
<body>

  <section id="loadingScreen" class="screen" aria-live="polite" aria-label="Loading">
    <div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-text">Loading…</div>
    </div>
  </section>

  <main id="landingPage" class="screen">
    <div class="card">
      <div class="brand">Miracle of the Desert</div>
      <p class="copy">Continue to the official Miracle of the Desert website.</p>

      <a id="continueButton"
         class="button"
         href="https://www.miracleofthedesert.com/"
         rel="noopener">
        Visit Miracle of the Desert
      </a>

      <div class="note">You’ll be taken to miracleofthedesert.com.</div>
    </div>
  </main>

  <script>
    (function () {
      const loadingScreen = document.getElementById('loadingScreen');
      const landingPage = document.getElementById('landingPage');
      const button = document.getElementById('continueButton');

      // Preserve incoming query parameters (for example UTM tags)
      // when the visitor clicks through to the main site.
      const sourceParams = new URLSearchParams(window.location.search);
      const destination = new URL(button.href);

      sourceParams.forEach((value, key) => {
        destination.searchParams.set(key, value);
      });

      button.href = destination.toString();

      // Show only the loading screen for exactly one second,
      // then reveal the landing page with the button.
      setTimeout(function () {
        loadingScreen.style.display = 'none';
        landingPage.classList.add('visible');
      }, 1000);
    })();
  </script>

</body>
</html>
