<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miracle of the Desert</title>
  <meta name="description" content="Continue to Miracle of the Desert." />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #d9d9d9;
      --button: #111111;
      --button-text: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      text-align: center;
    }
    .brand {
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    .copy {
      font-size: 17px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 auto 28px;
      max-width: 460px;
    }
    .loading {
      min-height: 72px;
      display: grid;
      place-items: center;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #e6e6e6;
      border-top-color: #333333;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 28px;
      border-radius: 8px;
      background: var(--button);
      color: var(--button-text);
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border: 1px solid var(--button);
      transition: transform .15s ease, opacity .15s ease;
    }
    .button:hover { opacity: .9; }
    .button:active { transform: translateY(1px); }
    .hidden { display: none; }
    .note {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.45;
      color: #8a8a8a;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Miracle of the Desert</div>
    <p class="copy">Continue to the official Miracle of the Desert website.</p>

    <div id="loadingState" class="loading" aria-live="polite" aria-label="Loading">
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <div id="continueState" class="hidden">
      <a id="continueButton" class="button" href="https://www.miracleofthedesert.com/" rel="noopener">Visit Miracle of the Desert</a>
      <div class="note">You’ll be taken to miracleofthedesert.com.</div>
    </div>
  </main>

  <script>
    (function () {
      const button = document.getElementById('continueButton');
      const loadingState = document.getElementById('loadingState');
      const continueState = document.getElementById('continueState');

      // Preserve incoming query parameters (for example UTM tags)
      // for the visitor's intentional click through to the main site.
      const sourceParams = new URLSearchParams(window.location.search);
      const destination = new URL(button.href);
      sourceParams.forEach((value, key) => destination.searchParams.set(key, value));
      button.href = destination.toString();

      // Show a brief one-second loading state, then reveal the CTA.
      setTimeout(function () {
        loadingState.classList.add('hidden');
        continueState.classList.remove('hidden');
        button.focus({ preventScroll: true });
      }, 1000);
    })();
  </script>
</body>
</html>
